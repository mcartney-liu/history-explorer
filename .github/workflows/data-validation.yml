name: Data Validation

# History Explorer - 数据层验收门禁
#
# 每次改动 data/ 下任何文件（实体 / 关系 / 证据 / 来源）时自动运行
# scripts/data-patch-check.py；验收未达成则流水线失败，阻断合入。
#
# 纯 stdlib，无需安装任何后端依赖（backend/app/validation.py 仅用
# dataclasses / typing，见其模块 docstring "No new dependency - stdlib only"）。
#
# 触发条件用 paths 过滤：任意分支只要动 data/ 就跑（含本 feature 分支与 master），
# 与 ci.yml（仅 master）互补，互不冲突。

on:
  push:
    paths:
      - 'data/**'
  pull_request:
    paths:
      - 'data/**'

jobs:
  data-acceptance:
    name: Data Acceptance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run data acceptance check
        run: python scripts/data-patch-check.py
