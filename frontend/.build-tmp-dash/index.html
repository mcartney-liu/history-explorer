<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History Explorer · 历史探索引擎</title>
    <!-- M73 Phase2-C: explicit SVG favicon — kills the /favicon.ico 404 console noise -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      /* ====== 参考图风格：深空宇宙 + 发光地球 + 星点 ======
         PO 2026-08-09 视觉对齐：保留深空暗角层，地球改为 CSS 径向渐变
         （不依赖外网图，离网可用），整体是参考图的深色+金氛围。 */
      html[data-theme="legacy"] body { background: #070b14; }
      .earth-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
        background:
          radial-gradient(ellipse 90% 60% at 50% -8%, #16263d 0%, #0b1320 45%, #070b12 100%);
      }
      /* 星点层 */
      .earth-bg .stars{
        position:absolute;inset:0;
        background-image:
          radial-gradient(1.6px 1.6px at 20px 30px, rgba(255,255,255,0.35), transparent),
          radial-gradient(1.2px 1.2px at 120px 80px, rgba(255,255,255,0.25), transparent),
          radial-gradient(1px 1px at 250px 150px, rgba(255,255,255,0.3), transparent),
          radial-gradient(1.8px 1.8px at 400px 60px, rgba(255,255,255,0.2), transparent),
          radial-gradient(1px 1px at 500px 220px, rgba(255,255,255,0.3), transparent),
          radial-gradient(1.4px 1.4px at 650px 90px, rgba(255,255,255,0.25), transparent),
          radial-gradient(1px 1px at 780px 180px, rgba(255,255,255,0.3), transparent),
          radial-gradient(1.8px 1.8px at 900px 40px, rgba(255,255,255,0.2), transparent),
          radial-gradient(1px 1px at 1000px 260px, rgba(255,255,255,0.3), transparent),
          radial-gradient(1.4px 1.4px at 1150px 120px, rgba(255,255,255,0.25), transparent);
        background-size: 1200px 300px;
        opacity:0.7;
      }
      .earth-bg .globe{
        position:absolute;width:180vw;height:180vh;left:-35%;top:-30%;border-radius:50%;
        background:
          radial-gradient(circle at 34% 28%, #4a7a9c 0%, #1e445f 32%, #0a1c2c 68%),
          repeating-linear-gradient(0deg, transparent 0 16px, rgba(255,255,255,0.045) 16px 17px),
          repeating-linear-gradient(90deg, transparent 0 16px, rgba(255,255,255,0.045) 16px 17px);
        box-shadow:
          inset -100px -60px 150px rgba(0,10,40,0.6),
          inset 50px 40px 120px rgba(60,120,180,0.12),
          0 0 250px rgba(20,50,100,0.25);
      }
      .earth-bg .globe:after{
        content:'';position:absolute;inset:-3%;border-radius:50%;
        background:radial-gradient(circle at 38% 32%,rgba(80,140,200,0.18),transparent 55%),radial-gradient(circle at 65% 60%,rgba(60,120,180,0.12),transparent 50%);
        pointer-events:none;
      }
      .earth-bg .vignette{
        position:absolute;inset:0;
        background:radial-gradient(ellipse at 55% 45%,transparent 30%,rgba(5,8,16,0.5) 70%,rgba(5,8,16,0.92) 100%);
      }
      #root { position: relative; z-index: 1; }
    </style>
    <script type="module" crossorigin src="/assets/index-RsMOnTBh.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C5LzESAd.css">
  </head>
  <body>
    <div class="earth-bg"><div class="stars"></div><div class="globe"></div><div class="vignette"></div></div>
    <div id="root" data-theme="legacy"></div>
  </body>
</html>
