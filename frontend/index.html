<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History Explorer · 历史探索引擎</title>
    <!-- M73 Phase2-C: explicit SVG favicon — kills the /favicon.ico 404 console noise -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      .earth-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
      .earth-bg .globe{
        position:absolute;width:180vw;height:180vh;left:-35%;top:-30%;border-radius:50%;
        background: url('https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?w=1600&q=80') center/cover no-repeat;
        box-shadow: inset -100px -60px 150px rgba(0,10,40,0.6), inset 50px 40px 120px rgba(60,120,180,0.12), 0 0 250px rgba(20,50,100,0.25);
        animation:earthRotate 120s linear infinite;
      }
      @keyframes earthRotate{from{background-position:center 0}to{background-position:center 100%}}
      .earth-bg .globe:after{
        content:'';position:absolute;inset:-3%;border-radius:50%;
        background:radial-gradient(circle at 38% 32%,rgba(80,140,200,0.15),transparent 55%),radial-gradient(circle at 65% 60%,rgba(60,120,180,0.1),transparent 50%);
        pointer-events:none;
      }
      .earth-bg .vignette{
        position:absolute;inset:0;
        background:radial-gradient(ellipse at 55% 45%,transparent 30%,rgba(5,8,16,0.5) 70%,rgba(5,8,16,0.92) 100%);
      }
      #root { position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <div class="earth-bg"><div class="globe"></div><div class="vignette"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
